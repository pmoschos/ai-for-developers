[project]
name = "ai_research_crew"
version = "0.1.0"
description = "ai_research_crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "anthropic>=0.104.1",
    "crewai[tools]==1.14.4",
    "gradio>=6.14.0",
    "openai>=2.38.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "resend>=2.30.1",
    "sendgrid>=6.12.5",
    "tavily-python>=0.7.24",
]

[project.scripts]
ai_research_crew = "ai_research_crew.main:run"
run_crew = "ai_research_crew.main:run"
train = "ai_research_crew.main:train"
replay = "ai_research_crew.main:replay"
test = "ai_research_crew.main:test"
run_with_trigger = "ai_research_crew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
